name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI must never deploy: no AWS credentials, no secrets, no registry push, no terraform apply.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q run_nexusops.py app tests
      - run: python -m unittest discover -s tests -v
      - run: python run_nexusops.py validate
      - run: python run_nexusops.py generate

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate

  docker:
    name: Docker build and health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: docker compose config --quiet
      - run: python run_nexusops.py build-image
      - name: Run container and wait for healthy status
        run: |
          docker run --detach --name nexusops-api --publish 8000:8000 payment-api:latest
          # Docker's port proxy can reset connections before uvicorn listens, so retry on all errors.
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:8000/health | tee health.json
          python -c "import json; assert json.load(open('health.json')) == {'status': 'ok'}"
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' nexusops-api)
            echo "Docker health status: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 3
          done
          docker logs nexusops-api
          exit 1
      - name: Install Trivy (checksum-pinned)
        env:
          TRIVY_VERSION: 0.76.1
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          curl --fail --silent --show-error --location --output trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf trivy.tar.gz -C "$RUNNER_TEMP/trivy" trivy
          rm trivy.tar.gz
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      - name: Trivy image scan (fixable HIGH/CRITICAL fail the build)
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress payment-api:latest
      - name: Trivy config scan (Terraform, Dockerfile, Compose)
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL .
      - name: Remove container
        if: always()
        run: docker rm --force nexusops-api || true
