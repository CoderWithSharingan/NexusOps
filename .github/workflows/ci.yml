name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI must never deploy: no AWS credentials, no secrets, no registry push, no terraform apply.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q run_nexusops.py app tests
      - run: python -m unittest discover -s tests -v
      - run: python run_nexusops.py validate
      - run: python run_nexusops.py generate

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate

  docker:
    name: Docker build and health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: docker compose config --quiet
      - run: python run_nexusops.py build-image
      - name: Run container and wait for healthy status
        run: |
          docker run --detach --name nexusops-api --publish 8000:8000 payment-api:latest
          # Docker's port proxy can reset connections before uvicorn listens, so retry on all errors.
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:8000/health | tee health.json
          python -c "import json; assert json.load(open('health.json')) == {'status': 'ok'}"
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' nexusops-api)
            echo "Docker health status: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 3
          done
          docker logs nexusops-api
          exit 1
      - name: Install Trivy (checksum-pinned)
        env:
          TRIVY_VERSION: 0.76.1
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          curl --fail --silent --show-error --location --output trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf trivy.tar.gz -C "$RUNNER_TEMP/trivy" trivy
          rm trivy.tar.gz
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      - name: Trivy image scan (fixable HIGH/CRITICAL fail the build)
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress payment-api:latest
      - run: python run_nexusops.py render-k8s
      - name: Trivy config scan (Terraform, Dockerfile, Compose, Kubernetes)
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL .
      - name: Remove container
        if: always()
        run: docker rm --force nexusops-api || true

  kubernetes:
    name: Deploy to ephemeral kind cluster
    runs-on: ubuntu-latest
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      KUBECTL_VERSION: v1.37.0
      KUBECTL_SHA256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
      KUBE_CONTEXT: kind-nexusops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install kind and kubectl (checksum-pinned)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/bin/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/bin/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KIND_SHA256}  $RUNNER_TEMP/bin/kind" | sha256sum --check --strict
          echo "${KUBECTL_SHA256}  $RUNNER_TEMP/bin/kubectl" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/kind" "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: python run_nexusops.py build-image
      - run: python run_nexusops.py render-k8s
      - run: kind create cluster --name nexusops --image "$KIND_NODE_IMAGE" --wait 120s
      - run: kind load docker-image payment-api:latest --name nexusops
      - name: Deploy and wait for rollout
        run: |
          kubectl --context "$KUBE_CONTEXT" create namespace nexusops
          kubectl --context "$KUBE_CONTEXT" --namespace nexusops apply -f build/kubernetes/manifests.yaml
          kubectl --context "$KUBE_CONTEXT" --namespace nexusops rollout status deployment/payment-api --timeout=180s
      - name: Verify configured replica count is ready
        run: |
          expected=$(python -c "import run_nexusops as n; print(n.load_config().get('deployment', {}).get('replicas', n.DEFAULT_REPLICAS))")
          ready=$(kubectl --context "$KUBE_CONTEXT" --namespace nexusops get deployment payment-api -o jsonpath='{.status.readyReplicas}')
          echo "Ready replicas: ${ready:-0} / expected ${expected}"
          [ "${ready:-0}" = "$expected" ]
      - name: Verify /health through the Service
        run: |
          kubectl --context "$KUBE_CONTEXT" --namespace nexusops port-forward service/payment-api 8080:80 &
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:8080/health | tee health.json
          python -c "import json; assert json.load(open('health.json')) == {'status': 'ok'}"
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl --context "$KUBE_CONTEXT" --namespace nexusops get all,events || true
          kubectl --context "$KUBE_CONTEXT" --namespace nexusops describe pods || true
          kubectl --context "$KUBE_CONTEXT" --namespace nexusops logs deployment/payment-api --all-containers || true
      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name nexusops || true
